services:
  mysql:
    image: mysql:8.4
    container_name: referralhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: referralhub
    ports:
      - "3306:3306"
    volumes:
      - referralhub_mysql:/var/lib/mysql

volumes:
  referralhub_mysql:
