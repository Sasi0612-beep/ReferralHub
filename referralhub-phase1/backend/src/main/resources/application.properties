spring.application.name=referralhub-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/referralhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_NAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Hindsight: leave disabled until the local Hindsight server or Cloud is configured.
hindsight.enabled=true
hindsight.base-url=https://api.hindsight.vectorize.io
hindsight.api-key=${PASSWORD}
hindsight.bank-prefix=referralhub-demo
